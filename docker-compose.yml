services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: koya-backend

    environment:
      DATABASE_URL: sqlite:///./clinic.db
      API_KEY: koya-clinic-secret-key

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: koya-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped
